<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ChinaHub Warehouse</title>
<meta name="description" content="Sign-in and staff control for the ChinaHub consolidation warehouse.">
<meta name="theme-color" content="#0b5c5e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* The tokens are the warehouse app's own, so the two look like one product. */
:root{
  --bg:#f3f6f5; --surface:#ffffff; --surface-2:#e9eeed; --surface-3:#dde4e3;
  --line:#ccd6d4; --line-strong:#aebab8;
  --fg:#141e1d; --fg-dim:#566766; --fg-faint:#7d8d8b;
  --primary:#0b5c5e; --primary-hi:#0a4a4c; --primary-fg:#ffffff; --primary-wash:#dfeceb;
  --st-expected:#6b7a79; --st-received:#9a5b06; --st-shelved:#0f766e;
  --st-released:#4338ca; --st-delivered:#15803d;
  --danger:#b4231d; --danger-wash:#fae6e4; --warn:#9a5b06; --ok:#15803d;
  --shadow:0 1px 2px rgba(10,30,28,.07), 0 8px 24px -12px rgba(10,30,28,.18);
  --shadow-lg:0 10px 48px -12px rgba(10,30,28,.34);
  --r:10px; --r-sm:7px; --r-lg:16px;
  --display:"Archivo","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0d1413; --surface:#151e1d; --surface-2:#1d2726; --surface-3:#273332;
  --line:#2b3837; --line-strong:#3e4e4c;
  --fg:#e4edec; --fg-dim:#94a4a2; --fg-faint:#748482;
  --primary:#2fa39b; --primary-hi:#47b8af; --primary-fg:#04201f; --primary-wash:#16302f;
  --st-expected:#8b9b99; --st-received:#d08a2a; --st-shelved:#2fa39b;
  --st-released:#8b87f0; --st-delivered:#49ab62;
  --danger:#e8655c; --danger-wash:#2e1a19; --warn:#d08a2a; --ok:#49ab62;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lg:0 10px 48px -12px rgba(0,0,0,.75);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0d1413; --surface:#151e1d; --surface-2:#1d2726; --surface-3:#273332;
  --line:#2b3837; --line-strong:#3e4e4c;
  --fg:#e4edec; --fg-dim:#94a4a2; --fg-faint:#748482;
  --primary:#2fa39b; --primary-hi:#47b8af; --primary-fg:#04201f; --primary-wash:#16302f;
  --st-expected:#8b9b99; --st-received:#d08a2a; --st-shelved:#2fa39b;
  --st-released:#8b87f0; --st-delivered:#49ab62;
  --danger:#e8655c; --danger-wash:#2e1a19; --warn:#d08a2a; --ok:#49ab62;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lg:0 10px 48px -12px rgba(0,0,0,.75);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--fg);
  font-family:var(--display); font-size:15px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
  min-height:100dvh;
}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.015em;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--primary);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono);font-feature-settings:"zero" 1}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- sign in ---------- */
.auth{min-height:100dvh;display:grid;place-items:center;padding:24px 0}
.auth-card{
  width:min(420px,100%); background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r-lg); box-shadow:var(--shadow-lg); padding:28px 24px 24px;
}
.logo{display:flex;align-items:center;gap:11px;margin-bottom:20px}
.logo-m{
  width:38px;height:38px;border-radius:9px;background:var(--primary);color:var(--primary-fg);
  display:grid;place-items:center;font-weight:700;font-size:17px;flex:none;
}
.logo-t{font-weight:700;font-size:16px;letter-spacing:-.02em;line-height:1.2}
.logo-s{font-size:12.5px;color:var(--fg-dim);line-height:1.3}

/* ---------- shell ---------- */
.top{
  position:sticky;top:0;z-index:50;background:var(--surface);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top,0px);
}
.top-in{display:flex;align-items:center;gap:12px;padding-block:9px;max-width:1280px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;min-width:0;margin-right:auto}
.brand-tx{min-width:0}
.who{display:flex;align-items:center;gap:9px;min-width:0}
.who-nm{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:22ch}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;max-width:1280px;margin:0 auto;padding-bottom:7px}
.tabs::-webkit-scrollbar{display:none}
.tab{
  border:1px solid transparent;background:none;color:var(--fg-dim);
  padding:6px 13px;border-radius:999px;font-size:13.5px;font-weight:600;white-space:nowrap;
}
.tab:hover{background:var(--surface-2);color:var(--fg)}
.tab[aria-current="page"]{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
main{max-width:1280px;margin:0 auto;padding:18px 0 72px}
.vhead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.vhead h2{font-size:21px}
.sub{color:var(--fg-dim);font-size:13.5px}

/* ---------- bits ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);
  padding:9px 15px;border-radius:var(--r-sm);font-weight:600;font-size:14px;
  min-height:42px;
}
.btn:hover{background:var(--surface-2)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
.btn.pri:hover{background:var(--primary-hi)}
.btn.dng{color:var(--danger);border-color:var(--danger)}
.btn.dng:hover{background:var(--danger-wash)}
.btn.sm{min-height:34px;padding:5px 11px;font-size:13px}
.btn.wide{width:100%}
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-size:12.5px;font-weight:600;color:var(--fg-dim);margin-bottom:5px}
.inp{
  width:100%;background:var(--surface);border:1px solid var(--line-strong);
  border-radius:var(--r-sm);padding:10px 12px;min-height:44px;
}
.inp:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px var(--primary-wash)}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 49%,var(--fg-dim) 50%),linear-gradient(-45deg,transparent 49%,var(--fg-dim) 50%);background-size:6px 6px;background-position:calc(100% - 16px) 19px,calc(100% - 10px) 19px;background-repeat:no-repeat;padding-right:34px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.g2{grid-template-columns:1fr}}
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;
  font-size:11.5px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;
  background:var(--surface-2);color:var(--fg-dim);
}
.chip.scanner{background:color-mix(in srgb,var(--st-expected) 16%,transparent);color:var(--st-expected)}
.chip.office{background:color-mix(in srgb,var(--st-released) 16%,transparent);color:var(--st-released)}
.chip.admin{background:var(--primary-wash);color:var(--primary)}
.chip.off{background:var(--danger-wash);color:var(--danger)}
.chip.s-expected{background:color-mix(in srgb,var(--st-expected) 16%,transparent);color:var(--st-expected)}
.chip.s-received{background:color-mix(in srgb,var(--st-received) 16%,transparent);color:var(--st-received)}
.chip.s-shelved{background:color-mix(in srgb,var(--st-shelved) 16%,transparent);color:var(--st-shelved)}
.chip.s-released{background:color-mix(in srgb,var(--st-released) 16%,transparent);color:var(--st-released)}
.chip.s-delivered{background:color-mix(in srgb,var(--st-delivered) 16%,transparent);color:var(--st-delivered)}
.banner{
  display:flex;gap:11px;padding:12px 14px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--surface-2);margin-bottom:14px;font-size:13.5px;
}
.banner b{display:block;margin-bottom:2px}
.banner.bad{background:var(--danger-wash);border-color:color-mix(in srgb,var(--danger) 35%,transparent);color:var(--danger)}
.banner.warn{background:color-mix(in srgb,var(--warn) 12%,transparent);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.banner.ok{background:color-mix(in srgb,var(--ok) 12%,transparent);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.empty{text-align:center;padding:44px 20px;color:var(--fg-dim)}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:5px}

/* ---------- staff + records lists ---------- */
.list{display:flex;flex-direction:column;gap:1px;background:var(--line);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.li{background:var(--surface);padding:13px 15px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.li-m{min-width:0;flex:1 1 220px}
.li-nm{font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.li-s{font-size:12.5px;color:var(--fg-dim);margin-top:2px}
.li-a{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.me{font-size:11px;color:var(--fg-faint);font-weight:600}

/* ---------- scan station ---------- */
.modes{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:12px}
@media (max-width:620px){.modes{grid-template-columns:repeat(2,1fr)}}
.mode{
  display:flex;flex-direction:column;gap:1px;align-items:flex-start;text-align:left;
  border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r-sm);
  padding:9px 11px;min-height:54px;
}
.mode:hover{background:var(--surface-2)}
.mode b{font-size:14px;font-weight:700}
.mode span{font-size:11.5px;color:var(--fg-dim);line-height:1.25}
.mode.on{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
.mode.on span{color:color-mix(in srgb,var(--primary-fg) 78%,transparent)}
.scanbox{display:flex;gap:8px;margin-bottom:4px}
.scanbox .inp{flex:1;font-size:19px;min-height:54px;letter-spacing:.02em}
.scanbox .btn{min-height:54px;padding-inline:20px}

/* ---------- stock tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:14px}
.tile{
  display:flex;flex-direction:column;gap:1px;align-items:flex-start;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:11px 13px;box-shadow:var(--shadow);min-height:74px;
}
.tile:hover{border-color:var(--line-strong)}
.tile.on{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary) inset,var(--shadow)}
.tile .k{font-size:12px;font-weight:600;color:var(--fg-dim);letter-spacing:.01em}
.tile .v{font-size:23px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.tile .n{font-size:11.5px;color:var(--fg-faint);line-height:1.25}

/* ---------- zones ---------- */
.hr-t{display:flex;align-items:center;gap:10px;margin:18px 0 10px}
.hr-t::after{content:"";flex:1;height:1px;background:var(--line)}
.sect-t{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--fg-dim)}
.zgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:10px}
.zcard{
  display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:14px;box-shadow:var(--shadow);
}
.zcard:hover{border-color:var(--primary)}
.zt{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
.zc{
  font-family:var(--mono);font-weight:700;font-size:13px;
  background:var(--primary-wash);color:var(--primary);padding:1px 7px;border-radius:5px;
}
.zn{font-weight:600;font-size:14px}
.zv{font-size:27px;font-weight:700;letter-spacing:-.025em;font-variant-numeric:tabular-nums;line-height:1.1}
.sub2{font-size:11.5px;color:var(--fg-faint);line-height:1.3}
.zbar{height:5px;border-radius:999px;background:var(--surface-3);width:100%;margin-top:7px;overflow:hidden}
.zbar i{display:block;height:100%;background:var(--primary);border-radius:999px}
.zbar.stg i{background:var(--st-received)}
.zbar.hot i{background:var(--danger)}

/* ---------- rates ---------- */
.lanes{display:flex;flex-direction:column;gap:1px;background:var(--line);border-radius:var(--r-sm);overflow:hidden;margin:8px 0 10px}
.lane{display:flex;align-items:baseline;gap:10px;background:var(--surface);padding:8px 11px;flex-wrap:wrap}
.ln{font-weight:600;font-size:13.5px}
.lm{font-size:11.5px;color:var(--fg-faint)}
.lp{margin-left:auto;font-weight:600;font-size:13.5px}

/* ---------- parcel drawer ---------- */
.li.click{cursor:pointer}
.li.click:hover{background:var(--surface-2)}
.drawer{
  background:var(--surface);width:min(620px,100%);max-height:92dvh;
  border-radius:var(--r-lg);box-shadow:var(--shadow-lg);
  display:flex;flex-direction:column;overflow:hidden;
}
.dhead{display:flex;align-items:flex-start;gap:12px;padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.dt{min-width:0;flex:1}
.dt b{display:block;font-size:16px;letter-spacing:.01em}
.dt>span{display:block;font-size:13.5px;color:var(--fg-dim);margin-top:2px}
.dbody{padding:16px 20px;overflow:auto;flex:1}
.dfoot{display:flex;gap:8px;padding:13px 20px;border-top:1px solid var(--line);background:var(--surface-2);flex-wrap:wrap}
.kv{display:grid;grid-template-columns:minmax(120px,38%) 1fr;gap:5px 14px;margin:0}
.kv dt{font-size:12.5px;color:var(--fg-dim);font-weight:600}
.kv dd{margin:0;font-size:13.5px;overflow-wrap:anywhere}
.sep{border:0;border-top:1px solid var(--line);margin:16px 0 0}
.hist{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.hi{display:flex;gap:11px;align-items:flex-start}
.ht{font-size:11.5px;color:var(--fg-faint);font-family:var(--mono);white-space:nowrap;padding-top:2px;min-width:92px}
.hb{min-width:0}
.hb b{display:block;font-size:13px;font-weight:600}
.hb span{font-size:12px;color:var(--fg-dim);overflow-wrap:anywhere}
@media (max-width:560px){
  .kv{grid-template-columns:1fr;gap:1px 0}
  .kv dd{margin-bottom:7px}
  .hi{flex-direction:column;gap:1px}
  .ht{min-width:0}
}

/* ---------- import mapping ---------- */
.maplist{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:7px 14px;margin-bottom:10px}
.maprow{display:flex;align-items:center;gap:9px}
.ml{font-size:12.5px;color:var(--fg-dim);font-weight:600;min-width:132px;flex:none}
.maprow .inp{min-height:36px;padding:5px 9px;font-size:13px;flex:1;min-width:0}
.maprow select.inp{background-position:calc(100% - 14px) 15px,calc(100% - 8px) 15px}
input[type=file].inp{padding:8px 10px;cursor:pointer}

/* ---------- lane table ---------- */
.lanetbl{display:flex;flex-direction:column;gap:6px}
.lanehd,.lanerow{display:grid;grid-template-columns:1.2fr 1.4fr .8fr .7fr .6fr auto;gap:7px;align-items:center}
.lanehd>div{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--fg-dim)}
.lanerow .inp{min-height:38px;padding:6px 9px;font-size:13.5px}
.lanerow select.inp{background-position:calc(100% - 14px) 16px,calc(100% - 8px) 16px}
@media (max-width:760px){
  .lanehd{display:none}
  .lanerow{grid-template-columns:1fr 1fr;gap:6px;padding:10px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2)}
}

/* ---------- toasts ---------- */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:90;display:flex;flex-direction:column;gap:8px;width:min(440px,calc(100vw - 32px))}
.toast{
  background:var(--fg);color:var(--bg);padding:11px 15px;border-radius:var(--r-sm);
  box-shadow:var(--shadow-lg);font-size:13.5px;font-weight:500;
}
.toast.bad{background:var(--danger);color:#fff}
.toast.ok{background:var(--ok);color:#fff}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,20,19,.5);z-index:80;display:grid;place-items:center;padding:18px}
.modal{width:min(440px,100%);background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);padding:22px;max-height:90dvh;overflow:auto}
.modal h3{font-size:18px;margin-bottom:4px}
.spin{display:inline-block;width:15px;height:15px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .6s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app" class="gut"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm";

/* The project and its publishable key. The key is meant to sit in client code:
   on its own it opens nothing, because every table is behind row-level
   security and an account with no profile has no role and therefore no access. */
const SUPABASE_URL = "https://llarspjcyvqzylxjxlld.supabase.co";
const SUPABASE_KEY = "sb_publishable_OKETaCQWF5_VvMj2Wa3cMw_jpOA3DBa";

const ROLES = {
  scanner: { label: "Scanner", blurb: "Shelves and looks up parcels. Never sees a charge." },
  office:  { label: "Office",  blurb: "Prices parcels and takes payment." },
  admin:   { label: "Admin",   blurb: "Everything, plus staff accounts and rates." },
};
const STATUS = {
  expected:  "On the way",
  received:  "In the warehouse",
  shelved:   "On a shelf",
  released:  "Out for delivery",
  delivered: "Delivered",
};

/* What a scan does. `to` is the status it moves a parcel into; lookup moves
   nothing and is the safe one to leave the gun sitting in. */
const MODES = {
  receive: { label: "Receive", sub: "arrived at the hub",  to: "received",  verb: "Received" },
  shelve:  { label: "Put away", sub: "onto a shelf",       to: "shelved",   verb: "Shelved" },
  release: { label: "Release", sub: "to a driver",         to: "released",  verb: "Released" },
  deliver: { label: "Deliver", sub: "to the customer",     to: "delivered", verb: "Delivered" },
  lookup:  { label: "Look up", sub: "changes nothing",     to: null,        verb: "Found" },
};
const SCANFEED_MAX = 14;

const S = {
  sb: null,
  session: null,
  me: null,            /* own profiles row, or null when there is none */
  tab: "scan",
  staff: [],
  busy: false,

  /* stock */
  q: "",
  rows: null,          /* the page on screen, null before the first load */
  searching: false,
  filters: { status: "", zone: "", paid: "" },
  page: 0,
  pageSize: 50,
  total: 0,
  stats: null,         /* the tiles, counted by the database */
  zoneStats: null,

  /* money — office and admin only */
  money: null,
  cfg: null,           /* rates and lane prices, readable only with the money */
  customers: null,
  custSearch: "",
  custOwing: true,
  custPage: 0,
  custPageSize: 50,
  custTotal: 0,

  /* setup */
  cfgDraft: null,      /* edits in progress; nothing is written until Save */
  cfgSaving: false,
  drawer: null,        /* the parcel currently open over everything */

  /* import */
  imp: null,           /* the file being brought in: headers, rows, mapping */
  impBusy: false, impChecking: false, impRunning: false,
  impDone: 0, impPreview: null, impResult: null, impError: "",
  laneCover: null,     /* how many parcels each lane would take */
  coverBusy: false,

  /* scan station */
  zones: [],
  mode: "lookup",
  dest: { zone: "", shelf: "" },   /* where "put away" is currently filing to */
  recvZone: "SHIP",                /* where a receive scan lands */
  scanFeed: [],
  undo: null,                      /* the last move, so one misfire is cheap */
  beep: true,
  scanBusy: false,
};

/* ------------------------------------------------------------- helpers ---- */
const $ = (s, r = document) => r.querySelector(s);
const el = (t, c, x) => {
  const n = document.createElement(t);
  if (c) n.className = c;
  if (x != null) n.textContent = x;
  return n;
};
const sees_money = () => S.me && (S.me.role === "office" || S.me.role === "admin");
const isAdmin = () => S.me && S.me.role === "admin";
const nf0 = new Intl.NumberFormat("en-US", { maximumFractionDigits: 0 });
const nf3 = new Intl.NumberFormat("en-US", { maximumFractionDigits: 3 });
const nf2 = new Intl.NumberFormat("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const money = n => "$" + nf2.format(Number(n) || 0);
const fmtDate = s => s ? new Date(s).toLocaleDateString([], { day: "2-digit", month: "short", year: "2-digit" }) : "—";

function toast(msg, kind) {
  const t = el("div", "toast" + (kind ? " " + kind : ""), msg);
  $("#toasts").append(t);
  setTimeout(() => t.remove(), kind === "bad" ? 6000 : 3500);
}

/* Supabase's own wording is fine for a wrong password and unhelpful for the
   rest, so the cases worth explaining get explained. */
function authMessage(err) {
  const m = String(err && err.message || err || "");
  if (/invalid login credentials/i.test(m)) return "That email and password do not match.";
  if (/email not confirmed/i.test(m)) return "That account has not been confirmed yet.";
  if (/failed to fetch|networkerror/i.test(m)) return "No connection. Check the network and try again.";
  if (/rate limit|too many/i.test(m)) return "Too many tries. Wait a minute and try again.";
  return m || "Could not sign in.";
}

  w.append(el("b", null, title));

     function behind it refuses them. */

  /* Office may read the rates — they are behind every charge — but only an
     admin may change them, which the screen itself makes plain. */
  if (sees_money()) t.push({ id: "setup", label: "Setup" });

function roleChip(role) {
